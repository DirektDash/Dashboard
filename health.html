<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/Icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
<title>Health — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<link rel="stylesheet" href="tokens.css">
<style>
:root {
  --bg-input:       rgba(0, 0, 0, 0.35);
  --bg-input-focus: rgba(0, 0, 0, 0.48);
}

main {
  position: relative;
  max-width: 680px; margin: 0 auto;
  padding: 56px 20px 80px;
  padding-top: max(56px, env(safe-area-inset-top, 56px));
  font-size: 15px; line-height: 1.5;
}

.section-title {
  font-family: var(--font-mono);
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary);
  margin: 0 4px 14px;
  display: flex; align-items: center; gap: 12px;
}
.section-title::before {
  content: ''; width: 18px; height: 1px;
  background: rgba(255,255,255,0.18);
  flex-shrink: 0;
}
.section-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(255,255,255,0.12), transparent);
}

.water-embed { margin-top: 56px; animation: slideUp 0.5s var(--spring-smooth) both; }
.water-iframe {
  display: block;
  width: 100%;
  height: 880px;
  border: 0;
  background: transparent;
  border-radius: var(--radius-lg);
  overflow: hidden;
  color-scheme: dark;
}
@media (max-width: 480px) {
  .water-embed { margin-top: 40px; }
  .water-iframe { height: 780px; }
}

/* ── Shared health card shell ── */
.health-section {
  margin-top: 40px;
  animation: slideUp 0.45s var(--spring-smooth) 0.12s both;
}
.health-section + .health-section { animation-delay: 0.22s; }

.health-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 22px 22px 18px;
  backdrop-filter: blur(40px) saturate(1.6) brightness(1.05);
  -webkit-backdrop-filter: blur(40px) saturate(1.6) brightness(1.05);
  box-shadow: var(--card-shadow);
  transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.25s var(--spring-card);
}
.health-card:hover {
  background: var(--glass-bg-hover);
  box-shadow: var(--card-shadow-hover);
  transform: translateY(-2px);
}

.hl-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-tertiary); display: block;
}

.hl-track {
  height: 5px; background: rgba(255,255,255,0.08);
  border-radius: 999px; overflow: hidden; margin: 10px 0 4px;
}
.hl-fill {
  height: 100%; width: 0%; background: var(--success);
  border-radius: 999px;
  transition: width 0.55s var(--spring-smooth);
}
.hl-fill.is-warn { background: var(--warning); }
.hl-fill.is-over { background: var(--warning); }

.hl-stat-row {
  display: flex; align-items: baseline; gap: 6px;
  margin-bottom: 6px; flex-wrap: wrap;
}
.hl-big-num {
  font-size: 40px; font-weight: 700;
  letter-spacing: -0.025em; line-height: 1;
  color: var(--text-primary); font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}
.hl-big-unit { font-size: 16px; color: var(--text-tertiary); font-weight: 500; }
.hl-status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-quaternary);
  margin-left: 4px; flex-shrink: 0; align-self: center;
  transition: background 0.3s, box-shadow 0.3s;
}
.hl-status-dot.is-good { background: var(--success); box-shadow: 0 0 6px rgba(52,211,153,0.6); }
.hl-status-dot.is-warn { background: var(--warning); box-shadow: 0 0 6px rgba(251,191,36,0.5); }
.hl-status-dot.is-bad  { background: var(--danger); animation: hl-pulse 1.6s ease-in-out infinite; }
@keyframes hl-pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.5); }
  50%      { box-shadow: 0 0 0 5px rgba(248,113,113,0); }
}
.hl-status-label { font-size: 12px; font-weight: 600; color: var(--text-tertiary); align-self: center; }

.hl-goal-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.hl-goal-val {
  font-family: var(--font-mono); font-size: 13px;
  color: var(--text-secondary); font-variant-numeric: tabular-nums;
}
.hl-goal-edit-btn {
  background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
  color: var(--text-tertiary); font-size: 10px; font-family: var(--font-mono);
  font-weight: 700; letter-spacing: 0.06em; padding: 3px 9px; border-radius: 6px;
  cursor: pointer; transition: color 0.15s, background 0.15s, border-color 0.15s;
}
.hl-goal-edit-btn:hover {
  color: var(--text-primary);
  background: rgba(255,255,255,0.09);
  border-color: rgba(255,255,255,0.24);
}

.hl-week-strip {
  display: grid; grid-template-columns: repeat(7,1fr);
  gap: 5px; margin: 14px 0 10px;
}
.hl-week-day { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.hl-week-day-lbl {
  font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--text-quaternary); text-transform: uppercase; font-family: var(--font-mono);
}
.hl-week-bar-wrap {
  width: 100%; height: 36px; background: rgba(255,255,255,0.06);
  border-radius: 5px; display: flex; align-items: flex-end; overflow: hidden;
}
.hl-week-bar {
  width: 100%; min-height: 2px; background: rgba(255,255,255,0.12);
  border-radius: 4px; transition: height 0.5s var(--spring-smooth);
}
.hl-week-bar.is-good  { background: var(--success); box-shadow: 0 0 8px rgba(52,211,153,0.35); }
.hl-week-bar.is-today { box-shadow: 0 0 0 1.5px rgba(255,255,255,0.35); }
.hl-week-day-val {
  font-size: 9px; font-family: var(--font-mono);
  color: var(--text-tertiary); font-variant-numeric: tabular-nums;
}

.hl-streak { font-size: 12px; font-weight: 600; color: #6ee7b7; margin-bottom: 14px; display: block; }

.hl-form-wrap { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-soft); }
.hl-form-lbl { margin-bottom: 10px; }
.hl-form-row { display: flex; gap: 8px; align-items: center; }

.hl-input {
  font-size: 15px; padding: 10px 13px; border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border); background: var(--bg-input);
  color: var(--text-primary); font-family: var(--font-mono);
  font-variant-numeric: tabular-nums; flex: 1; min-width: 0;
  transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
  -moz-appearance: textfield;
}
.hl-input::-webkit-outer-spin-button,
.hl-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.hl-input::placeholder { color: var(--text-quaternary); }
.hl-input:focus {
  outline: none;
  border-color: rgba(255,255,255,0.40);
  background: var(--bg-input-focus);
  box-shadow: 0 0 0 3px rgba(255,255,255,0.07);
}

.hl-btn {
  font-size: 13px; font-weight: 700; padding: 10px 20px; border-radius: var(--radius-md);
  border: none;
  background: linear-gradient(180deg, #FFFFFF 0%, #E8E8E8 100%);
  color: #000000; cursor: pointer; white-space: nowrap; font-family: inherit;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.95),
    0 4px 16px rgba(0,0,0,0.40),
    0 1px 3px rgba(0,0,0,0.20);
  transition: transform 0.15s var(--spring-bounce), filter 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.hl-btn:hover  { filter: brightness(1.04); transform: translateY(-1px); }
.hl-btn:active { transform: scale(0.97); filter: brightness(0.96); }

.hl-goal-editor { margin-top: 12px; }

/* ── Calorie indicator boxes ── */
.cal-indicators { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.cal-box {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  padding: 14px 12px 12px;
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 16px rgba(0,0,0,0.25);
  transition: background 0.2s ease, transform 0.2s var(--spring-card);
}
.cal-box:hover {
  background: rgba(255,255,255,0.09);
  transform: translateY(-1px);
}
.cal-box-lbl {
  font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-tertiary); font-family: var(--font-mono); margin-bottom: 5px;
}
.cal-box-num {
  font-size: 20px; font-weight: 700; line-height: 1.1;
  color: var(--text-primary); font-family: var(--font-mono); font-variant-numeric: tabular-nums;
}
.cal-box-unit { font-size: 11px; color: var(--text-tertiary); font-weight: 500; }
.cal-box-goal {
  font-size: 10px; font-family: var(--font-mono);
  color: var(--text-tertiary); font-variant-numeric: tabular-nums; margin-top: 2px;
}

.cal-food-list { display: flex; flex-direction: column; gap: 5px; }
.cal-food-row {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  border-radius: var(--radius-sm); background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.09); font-size: 13px;
  transition: background 0.15s ease;
}
.cal-food-row:hover { background: rgba(255,255,255,0.08); }
.cal-food-name {
  flex: 1; color: var(--text-primary); min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cal-food-meta {
  font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary);
  font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0;
}
.cal-food-del {
  background: transparent; border: none; color: var(--text-quaternary);
  cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 6px;
  opacity: 0.6; flex-shrink: 0; line-height: 1; transition: color 0.15s, background 0.15s;
}
.cal-food-del:hover { opacity: 1; color: var(--danger); background: rgba(248,113,113,0.10); }
.cal-food-empty { font-size: 12px; color: var(--text-quaternary); font-style: italic; padding: 4px 12px; }

.cal-food-form { display: flex; flex-direction: column; gap: 8px; }
.cal-nums-row  { display: flex; gap: 8px; align-items: center; }
.hl-input-sm   { max-width: 90px; }

.hl-goals-toggle {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; margin-top: 14px; padding: 10px 14px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
  color: var(--text-secondary); font-family: inherit; font-size: 12px; font-weight: 600;
  cursor: pointer; letter-spacing: 0.04em; transition: background 0.18s ease, border-color 0.18s ease;
  -webkit-tap-highlight-color: transparent;
}
.hl-goals-toggle:hover {
  background: rgba(255,255,255,0.09);
  border-color: rgba(255,255,255,0.22);
}
.hl-goals-arrow { font-size: 10px; transition: transform 0.2s; }
.hl-goals-panel { margin-top: 10px; }
.cal-goals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }


.attribution {
  text-align: center; margin-top: 28px;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-quaternary);
}


@media (max-width: 480px) {
  main { padding: 40px 14px 80px; }
  .health-card { padding: 18px 14px 14px; }
  .hl-big-num { font-size: 34px; }
  .cal-indicators { gap: 6px; }
  .cal-box-num { font-size: 17px; }
  .cal-goals-grid { grid-template-columns: 1fr; }
  .hl-input-sm { max-width: 80px; }
}
</style>
</head>
<body>

<main>
  <section id="water" class="water-embed">
    <div class="section-title">Water Tracker</div>
    <iframe src="po-water.html" class="water-iframe" loading="lazy" title="Water Tracker"></iframe>
  </section>

  <section id="sleepSection" class="health-section">
    <div class="section-title">Sleep Log</div>
    <div class="health-card">

      <div class="hl-stat-row">
        <div class="hl-big-num" id="sleepNum">—</div>
        <div class="hl-big-unit">hrs</div>
        <div class="hl-status-dot" id="sleepDot"></div>
        <div class="hl-status-label" id="sleepLabel">No entry yet</div>
      </div>

      <div class="hl-goal-row">
        <span class="hl-eyebrow" style="letter-spacing:0.04em;text-transform:none;font-size:12px">Goal:</span>
        <span class="hl-goal-val" id="sleepGoalDisplay">8 hrs</span>
        <button class="hl-goal-edit-btn" id="sleepGoalEditBtn">Edit</button>
      </div>

      <div class="hl-track"><div class="hl-fill" id="sleepFill"></div></div>
      <div class="hl-eyebrow" id="sleepPctText" style="margin-bottom:0">0% of goal</div>

      <div class="hl-week-strip" id="sleepWeek" aria-label="Last 7 days"></div>
      <span class="hl-streak" id="sleepStreak" style="display:none"></span>

      <div class="hl-form-wrap">
        <span class="hl-eyebrow hl-form-lbl">Log last night</span>
        <div class="hl-form-row">
          <input id="sleepInput" type="number" min="0" max="24" step="0.5"
                 inputmode="decimal" placeholder="7.5" class="hl-input" />
          <button id="sleepLogBtn" class="hl-btn">Log</button>
        </div>
      </div>

      <div class="hl-goal-editor" id="sleepGoalEditor" hidden>
        <div class="hl-form-wrap" style="margin-top:10px;padding-top:10px">
          <span class="hl-eyebrow hl-form-lbl">Sleep target (hours)</span>
          <div class="hl-form-row">
            <input id="sleepGoalInput" type="number" min="1" max="14" step="0.5"
                   inputmode="decimal" placeholder="8" class="hl-input" />
            <button id="sleepGoalSaveBtn" class="hl-btn">Save</button>
          </div>
        </div>
      </div>

    </div>
  </section>

  <section id="calSection" class="health-section">
    <div class="section-title">Nutrition &amp; Steps</div>
    <div class="health-card">

      <div class="cal-indicators">
        <div class="cal-box">
          <div class="cal-box-lbl">Calories</div>
          <div class="cal-box-num"><span id="calKcalVal">0</span><span class="cal-box-unit"> kcal</span></div>
          <div class="hl-track"><div class="hl-fill" id="calKcalBar"></div></div>
          <div class="cal-box-goal" id="calKcalGoal">/ 2500</div>
        </div>
        <div class="cal-box">
          <div class="cal-box-lbl">Protein</div>
          <div class="cal-box-num"><span id="calProtVal">0</span><span class="cal-box-unit"> g</span></div>
          <div class="hl-track"><div class="hl-fill" id="calProtBar"></div></div>
          <div class="cal-box-goal" id="calProtGoal">/ 150 g</div>
        </div>
        <div class="cal-box">
          <div class="cal-box-lbl">Steps</div>
          <div class="cal-box-num"><span id="calStepsVal">0</span></div>
          <div class="hl-track"><div class="hl-fill" id="calStepsBar"></div></div>
          <div class="cal-box-goal" id="calStepsGoal">/ 10,000</div>
        </div>
      </div>

      <div class="hl-form-wrap">
        <span class="hl-eyebrow hl-form-lbl">Today's food</span>
        <div id="calFoodList" class="cal-food-list"></div>
      </div>

      <div class="hl-form-wrap">
        <span class="hl-eyebrow hl-form-lbl">Add food</span>
        <div class="cal-food-form">
          <input id="calFoodName" type="text" placeholder="Food name (optional)" class="hl-input" />
          <div class="cal-nums-row">
            <input id="calFoodKcal"    type="number" min="0" step="1" inputmode="numeric"
                   placeholder="kcal" class="hl-input hl-input-sm" />
            <input id="calFoodProtein" type="number" min="0" step="1" inputmode="numeric"
                   placeholder="g protein" class="hl-input hl-input-sm" />
            <button id="calFoodAddBtn" class="hl-btn">Add</button>
          </div>
        </div>
      </div>

      <div class="hl-form-wrap">
        <span class="hl-eyebrow hl-form-lbl">Steps today</span>
        <div class="hl-form-row">
          <input id="calStepsInput" type="number" min="0" step="100"
                 inputmode="numeric" placeholder="0" class="hl-input" />
          <button id="calStepsSaveBtn" class="hl-btn">Save</button>
        </div>
      </div>

      <button class="hl-goals-toggle" id="calGoalsToggle" type="button" aria-expanded="false">
        <span>Edit Goals</span>
        <span class="hl-goals-arrow" id="calGoalsArrow">▸</span>
      </button>
      <div class="hl-goals-panel" id="calGoalsPanel" hidden>
        <div class="cal-goals-grid">
          <div class="hl-form-wrap" style="margin:0;padding-top:0;border-top:none">
            <label class="hl-eyebrow hl-form-lbl" for="calGoalKcal">Calorie goal</label>
            <input id="calGoalKcal" type="number" min="500" step="50" inputmode="numeric" class="hl-input" />
          </div>
          <div class="hl-form-wrap" style="margin:0;padding-top:0;border-top:none">
            <label class="hl-eyebrow hl-form-lbl" for="calGoalProtein">Protein goal (g)</label>
            <input id="calGoalProtein" type="number" min="10" step="5" inputmode="numeric" class="hl-input" />
          </div>
          <div class="hl-form-wrap" style="margin:0;padding-top:0;border-top:none">
            <label class="hl-eyebrow hl-form-lbl" for="calGoalSteps">Steps goal</label>
            <input id="calGoalSteps" type="number" min="1000" step="500" inputmode="numeric" class="hl-input" />
          </div>
          <div style="display:flex;align-items:flex-end">
            <button id="calGoalsSaveBtn" class="hl-btn" style="width:100%">Save Goals</button>
          </div>
        </div>
      </div>

    </div>
  </section>

  <div class="attribution">// editable template · all data stays in your browser</div>
</main>

<!-- ── Sleep Log ── -->
<script>
(() => {
  'use strict';

  const storeGet = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const storeSet = (k, v) => localStorage.setItem(k, JSON.stringify(v));

  function dateKey(offset = 0) {
    const d = new Date();
    d.setDate(d.getDate() - offset);
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  const DAY_LABELS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

  function getGoal() { return storeGet('sleep:goal') || 8; }
  function getLog(key) { const v = storeGet('sleep:log:' + key); return typeof v === 'number' ? v : null; }

  function render() {
    const goal = getGoal();
    const todayVal = getLog(dateKey(0));

    const numEl    = document.getElementById('sleepNum');
    const dotEl    = document.getElementById('sleepDot');
    const labelEl  = document.getElementById('sleepLabel');
    const fillEl   = document.getElementById('sleepFill');
    const pctEl    = document.getElementById('sleepPctText');
    const goalDisp = document.getElementById('sleepGoalDisplay');
    const weekEl   = document.getElementById('sleepWeek');
    const streakEl = document.getElementById('sleepStreak');
    if (!numEl) return;

    goalDisp.textContent = goal + ' hrs';

    if (todayVal !== null) {
      numEl.textContent = todayVal;
      const pct = Math.min(100, Math.round(todayVal / goal * 100));
      fillEl.style.width = pct + '%';
      fillEl.classList.toggle('is-warn', todayVal < goal);
      pctEl.textContent = pct + '% of goal';
      dotEl.classList.remove('is-good','is-warn','is-bad');
      if (todayVal >= goal)         dotEl.classList.add('is-good');
      else if (todayVal >= goal * 0.8) dotEl.classList.add('is-warn');
      else                          dotEl.classList.add('is-bad');
      labelEl.textContent = todayVal >= goal ? 'Goal met' : (todayVal + ' / ' + goal + ' hrs');
    } else {
      numEl.textContent = '—';
      fillEl.style.width = '0%';
      pctEl.textContent = '0% of goal';
      dotEl.className = 'hl-status-dot';
      labelEl.textContent = 'No entry yet';
    }

    // 7-day strip
    weekEl.innerHTML = '';
    const today = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      const val = getLog(key);
      const pct = val !== null ? Math.min(100, val / goal * 100) : 0;
      const isGood = val !== null && val >= goal;
      const isToday = i === 0;
      const col = document.createElement('div');
      col.className = 'hl-week-day';
      col.innerHTML = `
        <span class="hl-week-day-lbl">${DAY_LABELS[d.getDay()]}</span>
        <div class="hl-week-bar-wrap">
          <div class="hl-week-bar${isGood ? ' is-good' : ''}${isToday ? ' is-today' : ''}" style="height:${Math.max(4,pct)}%"></div>
        </div>
        <span class="hl-week-day-val">${val !== null ? val : '—'}</span>`;
      weekEl.appendChild(col);
    }

    // streak
    let streak = 0;
    for (let i = 0; i < 365; i++) {
      const v = getLog(dateKey(i));
      if (v !== null && v >= goal) streak++;
      else break;
    }
    if (streak > 0) {
      streakEl.textContent = streak + '-night streak';
      streakEl.style.display = '';
    } else {
      streakEl.style.display = 'none';
    }
  }

  function boot() {
    render();

    document.getElementById('sleepLogBtn').addEventListener('click', () => {
      const inp = document.getElementById('sleepInput');
      let val = parseFloat(inp.value);
      if (isNaN(val)) return;
      val = Math.round(Math.max(0, Math.min(24, val)) * 2) / 2;
      storeSet('sleep:log:' + dateKey(0), val);
      inp.value = '';
      render();
    });

    document.getElementById('sleepInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('sleepLogBtn').click();
    });

    document.getElementById('sleepGoalEditBtn').addEventListener('click', () => {
      const editor = document.getElementById('sleepGoalEditor');
      const hidden = editor.hasAttribute('hidden');
      if (hidden) {
        document.getElementById('sleepGoalInput').value = getGoal();
        editor.removeAttribute('hidden');
      } else {
        editor.setAttribute('hidden', '');
      }
    });

    document.getElementById('sleepGoalSaveBtn').addEventListener('click', () => {
      const inp = document.getElementById('sleepGoalInput');
      let val = parseFloat(inp.value);
      if (isNaN(val)) return;
      val = Math.round(Math.max(1, Math.min(14, val)) * 2) / 2;
      storeSet('sleep:goal', val);
      document.getElementById('sleepGoalEditor').setAttribute('hidden', '');
      render();
    });

    setInterval(render, 60_000);
    window.addEventListener('storage', render);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
  else boot();
})();
</script>

<!-- ── Calorie Tracker ── -->
<script>
(() => {
  'use strict';

  const storeGet = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const storeSet = (k, v) => localStorage.setItem(k, JSON.stringify(v));

  function dateKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  const DEFAULT_GOALS = { kcal: 2500, protein: 150, steps: 10000 };

  function getGoals() { return Object.assign({}, DEFAULT_GOALS, storeGet('cal:goals') || {}); }
  function getLog() { return Object.assign({ foods: [], steps: 0 }, storeGet('cal:log:' + dateKey()) || {}); }
  function saveLog(log) { storeSet('cal:log:' + dateKey(), log); }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function barPct(val, goal) { return Math.min(100, goal > 0 ? val / goal * 100 : 0); }

  function render() {
    const goals = getGoals();
    const log   = getLog();
    const totKcal = log.foods.reduce((s, f) => s + (f.kcal || 0), 0);
    const totProt = log.foods.reduce((s, f) => s + (f.protein || 0), 0);
    const steps  = log.steps || 0;

    const q = (id) => document.getElementById(id);
    if (!q('calKcalVal')) return;

    q('calKcalVal').textContent  = totKcal.toLocaleString();
    q('calProtVal').textContent  = totProt;
    q('calStepsVal').textContent = steps.toLocaleString();

    q('calKcalGoal').textContent  = '/ ' + goals.kcal.toLocaleString();
    q('calProtGoal').textContent  = '/ ' + goals.protein + ' g';
    q('calStepsGoal').textContent = '/ ' + goals.steps.toLocaleString();

    const kcalBar = q('calKcalBar');
    kcalBar.style.width = barPct(totKcal, goals.kcal) + '%';
    kcalBar.classList.toggle('is-over', totKcal > goals.kcal);
    kcalBar.classList.toggle('is-warn', totKcal > goals.kcal);

    q('calProtBar').style.width  = barPct(totProt, goals.protein) + '%';
    q('calStepsBar').style.width = barPct(steps, goals.steps) + '%';

    // food list
    const listEl = q('calFoodList');
    if (!log.foods.length) {
      listEl.innerHTML = '<div class="cal-food-empty">Nothing logged yet</div>';
    } else {
      listEl.innerHTML = log.foods.map(f => `
        <div class="cal-food-row" data-id="${f.id}">
          <span class="cal-food-name">${escHtml(f.name || 'Food')}</span>
          <span class="cal-food-meta">${f.kcal ? f.kcal + ' kcal' : ''}${f.kcal && f.protein ? ' · ' : ''}${f.protein ? f.protein + 'g' : ''}</span>
          <button class="cal-food-del" data-id="${f.id}" aria-label="Remove">×</button>
        </div>`).join('');
    }
  }

  function boot() {
    render();

    // add food
    document.getElementById('calFoodAddBtn').addEventListener('click', () => {
      const name   = document.getElementById('calFoodName').value.trim();
      const kcal   = parseInt(document.getElementById('calFoodKcal').value, 10) || 0;
      const prot   = parseInt(document.getElementById('calFoodProtein').value, 10) || 0;
      if (!kcal && !prot) return;
      const log = getLog();
      log.foods.push({ id: Date.now(), name: name || 'Food', kcal, protein: prot });
      saveLog(log);
      document.getElementById('calFoodName').value = '';
      document.getElementById('calFoodKcal').value = '';
      document.getElementById('calFoodProtein').value = '';
      render();
    });

    ['calFoodKcal','calFoodProtein'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('calFoodAddBtn').click();
      });
    });

    // delete food (delegation)
    document.getElementById('calFoodList').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-id]');
      if (!btn || !btn.classList.contains('cal-food-del')) return;
      const id = Number(btn.getAttribute('data-id'));
      const log = getLog();
      log.foods = log.foods.filter(f => f.id !== id);
      saveLog(log);
      render();
    });

    // save steps
    document.getElementById('calStepsSaveBtn').addEventListener('click', () => {
      const inp = document.getElementById('calStepsInput');
      const val = parseInt(inp.value, 10);
      if (isNaN(val) || val < 0) return;
      const log = getLog();
      log.steps = val;
      saveLog(log);
      inp.value = '';
      render();
    });

    document.getElementById('calStepsInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('calStepsSaveBtn').click();
    });

    // goals panel toggle
    document.getElementById('calGoalsToggle').addEventListener('click', () => {
      const panel = document.getElementById('calGoalsPanel');
      const arrow = document.getElementById('calGoalsArrow');
      const open  = panel.hasAttribute('hidden');
      if (open) {
        const g = getGoals();
        document.getElementById('calGoalKcal').value    = g.kcal;
        document.getElementById('calGoalProtein').value = g.protein;
        document.getElementById('calGoalSteps').value   = g.steps;
        panel.removeAttribute('hidden');
        arrow.style.transform = 'rotate(90deg)';
        document.getElementById('calGoalsToggle').setAttribute('aria-expanded', 'true');
      } else {
        panel.setAttribute('hidden', '');
        arrow.style.transform = '';
        document.getElementById('calGoalsToggle').setAttribute('aria-expanded', 'false');
      }
    });

    // save goals
    document.getElementById('calGoalsSaveBtn').addEventListener('click', () => {
      const kcal    = parseInt(document.getElementById('calGoalKcal').value, 10);
      const protein = parseInt(document.getElementById('calGoalProtein').value, 10);
      const steps   = parseInt(document.getElementById('calGoalSteps').value, 10);
      if (!kcal || !protein || !steps) return;
      storeSet('cal:goals', { kcal, protein, steps });
      document.getElementById('calGoalsPanel').setAttribute('hidden', '');
      document.getElementById('calGoalsArrow').style.transform = '';
      document.getElementById('calGoalsToggle').setAttribute('aria-expanded', 'false');
      render();
    });

    setInterval(render, 60_000);
    window.addEventListener('storage', render);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
  else boot();
})();
</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof initCloudSync !== 'function') return;
    initCloudSync({
      appKey: 'health',
      syncedKeys: ['po_water_v1', 'sleep:goal', 'cal:goals'],
      syncedPrefixes: ['sleep:log:', 'cal:log:'],
      onApplied: function () { window.dispatchEvent(new Event('storage')); }
    });
  });
</script>
