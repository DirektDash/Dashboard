<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>AI Assistant</title>
<script src="topbar.js" defer></script>

<script>
const CONFIG = {
  // Ollama endpoint — must be reachable from the browser.
  // Change the port if you launched Ollama with OLLAMA_PORT=xxxx.
  // NOTE: only works when the dashboard is served over http:// (local).
  // HTTPS pages (Vercel) cannot reach a plain-http localhost server.
  ollamaUrl: 'http://localhost:11434',

  // The model you have pulled in Ollama.
  // Run `ollama pull qwen2.5:latest` if you haven't already.
  // The user requested "qwen 3.5:cloud" — using qwen2.5:latest as the
  // closest available Ollama model; change the string below if needed.
  model: 'qwen2.5:latest',
};
</script>

<style>
:root {
  --bg: #0a0a0b;
  --bg-card: #111113;
  --text-1: #ffffff;
  --text-2: rgba(255,255,255,0.6);
  --text-3: rgba(255,255,255,0.4);
  --text-4: rgba(255,255,255,0.22);
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.14);
  --accent: #a78bfa;
  --accent-bg: rgba(167,139,250,0.10);
  --accent-border: rgba(167,139,250,0.20);
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, SF Mono, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text-1);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  height: 100%; overflow: hidden;
}
body { display: flex; flex-direction: column; }

/* ---- Layout shell ---- */
.ai-shell {
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

/* ---- Context pill bar ---- */
.ai-ctx-bar {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px 6px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
}
.ai-ctx-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 11px; font-weight: 600; color: var(--text-3);
  white-space: nowrap;
}
.ai-ctx-pill.loaded { color: var(--accent); border-color: var(--accent-border); background: var(--accent-bg); }
.ai-ctx-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.ai-ctx-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-4); margin-right: 2px; }

/* ---- Messages scroll area ---- */
.ai-messages {
  flex: 1 1 0;
  overflow-y: auto;
  padding: 16px 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.ai-messages::-webkit-scrollbar { width: 0; }

/* ---- Welcome screen ---- */
.ai-welcome {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; flex: 1; gap: 12px;
  padding: 32px 24px; text-align: center;
}
.ai-welcome-icon { font-size: 40px; line-height: 1; }
.ai-welcome-title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.ai-welcome-sub { font-size: 13px; color: var(--text-3); line-height: 1.5; max-width: 300px; }
.ai-suggestions {
  display: flex; flex-direction: column; gap: 7px;
  width: 100%; max-width: 360px; margin-top: 8px;
}
.ai-suggestion-btn {
  width: 100%; padding: 11px 14px; text-align: left;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text-2); font-family: inherit; font-size: 13px;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.ai-suggestion-btn:hover { background: rgba(167,139,250,0.06); border-color: var(--accent-border); color: var(--text-1); }

/* ---- Message bubbles ---- */
.ai-msg {
  display: flex; align-items: flex-end; gap: 8px;
  max-width: 100%; animation: msgIn 0.18s ease;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.ai-msg.user { flex-direction: row-reverse; }
.ai-bubble {
  max-width: min(72%, 480px);
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px; line-height: 1.55;
  word-break: break-word;
}
.ai-msg.user .ai-bubble {
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  color: var(--text-1);
  border-bottom-right-radius: 4px;
}
.ai-msg.assistant .ai-bubble {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-1);
  border-bottom-left-radius: 4px;
}
.ai-msg.assistant .ai-bubble code {
  font-family: var(--font-mono); font-size: 12px;
  background: rgba(255,255,255,0.06); border-radius: 4px;
  padding: 1px 5px;
}
.ai-msg.assistant .ai-bubble pre {
  font-family: var(--font-mono); font-size: 12px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px;
  overflow-x: auto; margin: 8px 0 0;
  white-space: pre-wrap;
}
.ai-avatar {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; margin-bottom: 2px;
}
.ai-msg.assistant .ai-avatar {
  background: var(--accent-bg); border: 1px solid var(--accent-border);
}
.ai-msg.user .ai-avatar { display: none; }

/* Streaming cursor */
.ai-cursor {
  display: inline-block; width: 7px; height: 13px;
  background: var(--accent); border-radius: 2px;
  margin-left: 2px; vertical-align: text-bottom;
  animation: blink 0.8s step-start infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ---- Error message ---- */
.ai-error {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px;
  background: rgba(248,113,113,0.06);
  border: 1px solid rgba(248,113,113,0.18);
  border-radius: 12px;
  font-size: 13px; color: #fca5a5; line-height: 1.5;
}
.ai-error-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

/* ---- Input bar ---- */
.ai-input-bar {
  display: flex; align-items: flex-end; gap: 8px;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
}
body.has-bottombar .ai-input-bar {
  padding-bottom: calc(82px + env(safe-area-inset-bottom));
}
.ai-input {
  flex: 1 1 0; min-width: 0;
  padding: 11px 14px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 14px;
  color: var(--text-1);
  font-family: inherit; font-size: 14px;
  resize: none; outline: none;
  line-height: 1.45; max-height: 140px;
  overflow-y: auto;
  transition: border-color 0.15s;
  -webkit-overflow-scrolling: touch;
}
.ai-input:focus { border-color: var(--accent-border); }
.ai-input::placeholder { color: var(--text-4); }
.ai-send-btn {
  width: 42px; height: 42px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent);
  border: none; border-radius: 12px;
  color: #fff; cursor: pointer;
  transition: opacity 0.15s, transform 0.10s;
  -webkit-tap-highlight-color: transparent;
}
.ai-send-btn:hover { opacity: 0.88; }
.ai-send-btn:active { transform: scale(0.93); }
.ai-send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
.ai-send-btn svg { width: 18px; height: 18px; }

/* ---- Model badge in header area ---- */
.ai-model-badge {
  margin-left: auto; display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 999px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-4); white-space: nowrap;
}
.ai-model-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #6ee7b7; flex-shrink: 0;
  animation: pulse-dot 2s ease-in-out infinite;
}
.ai-model-dot.offline { background: #ff8a8a; animation: none; }
@keyframes pulse-dot {
  0%, 100% { opacity: 1; } 50% { opacity: 0.45; }
}

@media (max-width: 480px) {
  .ai-messages { padding: 12px 10px 10px; gap: 10px; }
  .ai-bubble { max-width: 86%; font-size: 13.5px; }
  .ai-input-bar { padding-left: 10px; padding-right: 10px; gap: 6px; }
}
</style>
</head>
<body>

<div class="ai-shell">
  <!-- Context pills showing which data modules loaded -->
  <div class="ai-ctx-bar" id="aiCtxBar">
    <span class="ai-ctx-label">Context</span>
    <span class="ai-ctx-pill" id="ctxGoals"><span class="ai-ctx-dot"></span>Goals</span>
    <span class="ai-ctx-pill" id="ctxWater"><span class="ai-ctx-dot"></span>Water</span>
    <span class="ai-ctx-pill" id="ctxWeight"><span class="ai-ctx-dot"></span>Weight</span>
    <span class="ai-ctx-pill" id="ctxGym"><span class="ai-ctx-dot"></span>Gym</span>
    <span class="ai-ctx-pill" id="ctxStack"><span class="ai-ctx-dot"></span>Stack</span>
    <span class="ai-model-badge" id="aiModelBadge">
      <span class="ai-model-dot offline" id="aiModelDot"></span>
      <span id="aiModelName">—</span>
    </span>
  </div>

  <!-- Chat messages -->
  <div class="ai-messages" id="aiMessages">
    <div class="ai-welcome" id="aiWelcome">
      <div class="ai-welcome-icon">✨</div>
      <div class="ai-welcome-title">Your AI Assistant</div>
      <div class="ai-welcome-sub">I have access to your goals, workouts, water intake, body weight, and supplement stack. Ask me anything.</div>
      <div class="ai-suggestions" id="aiSuggestions">
        <button class="ai-suggestion-btn" data-q="How am I doing today? Give me a full summary.">📊 How am I doing today?</button>
        <button class="ai-suggestion-btn" data-q="What should I focus on in today's workout?">💪 What should I focus on today?</button>
        <button class="ai-suggestion-btn" data-q="Am I hitting my water target and what's my trend?">💧 How's my water intake looking?</button>
        <button class="ai-suggestion-btn" data-q="What's my body weight trend over the last few weeks?">⚖️ What's my weight trend?</button>
      </div>
    </div>
  </div>
</div>

<!-- Input bar (sits above the bottombar) -->
<div class="ai-input-bar" id="aiInputBar">
  <textarea
    class="ai-input" id="aiInput"
    placeholder="Ask about your health, workouts, or goals…"
    rows="1"
    aria-label="Message"
  ></textarea>
  <button class="ai-send-btn" id="aiSendBtn" aria-label="Send" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
  </button>
</div>

<script>
(function () {
  'use strict';

  const ollamaUrl = CONFIG.ollamaUrl.replace(/\/$/, '');
  const model     = CONFIG.model;

  // Conversation history sent to Ollama [{role, content}]
  let messages = [];
  let streaming = false;

  // ── DOM refs ──────────────────────────────────────────────────────────
  const msgContainer = document.getElementById('aiMessages');
  const welcome      = document.getElementById('aiWelcome');
  const inputEl      = document.getElementById('aiInput');
  const sendBtn      = document.getElementById('aiSendBtn');
  const modelName    = document.getElementById('aiModelName');
  const modelDot     = document.getElementById('aiModelDot');

  modelName.textContent = model;

  // ── Auto-resize textarea ──────────────────────────────────────────────
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);

  document.querySelectorAll('.ai-suggestion-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      inputEl.value = btn.dataset.q;
      send();
    });
  });

  // ── Context builder ───────────────────────────────────────────────────
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }
  function fmtDate(str) {
    try {
      const d = new Date(str + 'T12:00:00');
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: '2-digit' });
    } catch { return str; }
  }
  function pill(id) { return document.getElementById(id); }
  function markLoaded(id) { pill(id) && pill(id).classList.add('loaded'); }

  function buildContext() {
    const today = todayStr();
    const lines  = [];
    lines.push('You are a personal health and fitness AI embedded in this user\'s private dashboard.');
    lines.push('You have live access to their data shown below. Be direct, friendly, and specific — reference their actual numbers when relevant. Use plain text; avoid markdown headers.');
    lines.push('');
    lines.push('TODAY: ' + new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }));
    lines.push('');

    // ── Goals ──
    try {
      const raw = localStorage.getItem('goals:' + today);
      const goals = raw ? JSON.parse(raw) : [];
      if (goals.length) {
        const done = goals.filter(g => g.done).length;
        lines.push('GOALS (' + done + '/' + goals.length + ' done today):');
        goals.forEach(g => lines.push('  ' + (g.done ? '✓' : '✗') + ' ' + g.text));
        markLoaded('ctxGoals');
      } else {
        lines.push('GOALS: No goals set for today.');
      }
    } catch {}
    lines.push('');

    // ── Water ──
    try {
      const raw = localStorage.getItem('po_water_v1');
      const w = raw ? JSON.parse(raw) : null;
      if (w) {
        const logs     = w.logs || {};
        const todayLog = logs[today] || 0;
        const p        = w.profile || {};
        const wKg      = w.weightUnit === 'lb' ? (p.weightKg || 0) / 2.20462 : (p.weightKg || 0);
        const base     = wKg * 35;
        const ex       = (p.activityHrsPerWeek || 0) / 7 * 500;
        const caf      = Math.max(0, (w.caffeineMgPerDay || 0) - 200) * 1.5;
        const subs     = (w.substances || []).reduce((s, x) => {
          const dose = (x && x.dose != null ? x.dose : (x && x.defaultDose)) || 0;
          return s + Math.max(0, dose * ((x && x.mlPerUnit) || 0));
        }, 0);
        let adj = 0;
        if (p.sex === 'm') adj += 200;
        if ((p.age || 0) >= 50) adj += 100;
        const totalMl  = base + ex + caf + subs + adj;
        let unitVol;
        if (w.unit === 'glass')      unitVol = w.glassMl || 250;
        else if (w.unit === 'oz')    unitVol = 30;
        else if (w.unit === 'ml')    unitVol = 1;
        else                         unitVol = w.bottleMl || 500;
        const targetUnits = Math.max(1, Math.ceil(totalMl / unitVol));
        const unitLabel   = w.unit === 'glass' ? 'glasses' : w.unit === 'oz' ? 'oz' : w.unit === 'ml' ? 'ml' : 'bottles';
        const pct = Math.round(todayLog / targetUnits * 100);
        lines.push('WATER:');
        lines.push('  Today: ' + todayLog + '/' + targetUnits + ' ' + unitLabel + ' (' + pct + '% of daily target, ~' + Math.round(totalMl) + 'ml goal)');
        lines.push('  Profile: ' + (p.weightKg || '?') + 'kg, ' + (p.age || '?') + 'yo, ' + (p.sex || '?') + ', ' + (p.activityHrsPerWeek || 0) + 'h activity/week');
        if (w.substances && w.substances.length) {
          lines.push('  Substances that affect target: ' + w.substances.map(s => (s.name || s.id) + ' ' + ((s.dose != null ? s.dose : s.defaultDose) || '') + ' ' + (s.unit || '')).join(', '));
        }
        markLoaded('ctxWater');
      }
    } catch {}
    lines.push('');

    // ── Body weight ──
    try {
      const raw = localStorage.getItem('po_coach_weights');
      const entries = raw ? JSON.parse(raw) : [];
      if (entries.length) {
        const sorted = [...entries].sort((a, b) => (a.dateKey || a.date || '') > (b.dateKey || b.date || '') ? 1 : -1);
        const recent = sorted.slice(-10);
        const latest = recent[recent.length - 1];
        const oldest = recent[0];
        const diff   = latest && oldest && recent.length > 1 ? (latest.weight - oldest.weight).toFixed(1) : null;
        const trend  = diff === null ? '' : diff > 0 ? ' (↑' + diff + ' over last ' + recent.length + ' entries)' : diff < 0 ? ' (↓' + Math.abs(diff) + ' over last ' + recent.length + ' entries)' : ' (stable)';
        lines.push('BODY WEIGHT (last ' + recent.length + ' entries):');
        recent.slice(-7).forEach(e => lines.push('  ' + fmtDate(e.dateKey || e.date) + ': ' + e.weight + ' ' + (e.unit || 'kg')));
        if (diff !== null) lines.push('  Trend: ' + trend.trim());
        markLoaded('ctxWeight');
      }
    } catch {}
    lines.push('');

    // ── Gym ──
    try {
      const raw = localStorage.getItem('po_coach_v1');
      const gym = raw ? JSON.parse(raw) : null;
      if (gym) {
        lines.push('GYM:');
        const units = gym.units || 'kg';
        // Today's split
        if (gym.splitRotation && gym.splitAnchor) {
          try {
            const rot   = gym.splitRotation;
            const a     = new Date(gym.splitAnchor.date);
            const t     = new Date(today);
            const diff  = Math.round((t - a) / 86400000);
            const idx   = ((gym.splitAnchor.index + diff) % rot.length + rot.length) % rot.length;
            lines.push('  Today\'s split: ' + rot[idx]);
          } catch {}
        }
        // Exercise list with most recent set
        const exs = gym.exercises || [];
        if (exs.length) {
          lines.push('  Exercises (' + exs.length + ' in programme):');
          exs.slice(0, 20).forEach(e => {
            const logs = e.logs || [];
            const last = logs[logs.length - 1];
            const lastSet = last ? (e.bw ? last.reps + ' reps' : last.weight + units + ' × ' + last.reps) : 'not yet logged';
            lines.push('    ' + e.name + ' [' + (e.day || '?') + ']: last set ' + lastSet);
          });
        }
        // Recent workout done dates
        const doneRaw = localStorage.getItem('po_coach_workout_done');
        const done    = doneRaw ? JSON.parse(doneRaw) : {};
        const doneDates = Object.keys(done).filter(k => done[k]).sort().slice(-7);
        if (doneDates.length) lines.push('  Recent workout sessions: ' + doneDates.map(fmtDate).join(', '));
        markLoaded('ctxGym');
      }
    } catch {}
    lines.push('');

    // ── Supplement stack ──
    try {
      const raw = localStorage.getItem('stack:items');
      const items = raw ? JSON.parse(raw) : [];
      const takenRaw = localStorage.getItem('stack:taken:' + today);
      const taken    = takenRaw ? JSON.parse(takenRaw) : {};
      if (items.length) {
        lines.push('SUPPLEMENT STACK (' + items.length + ' items):');
        items.forEach(s => {
          const status = taken[s.name] ? '✓ taken' : '✗ not taken';
          lines.push('  ' + s.name + ' · ' + (s.dose || '?') + ' · ' + (s.window || 'anytime') + ' — ' + status);
        });
        markLoaded('ctxStack');
      }
    } catch {}

    return lines.join('\n');
  }

  // ── Ollama connection check ───────────────────────────────────────────
  async function checkOllama() {
    try {
      const r = await fetch(ollamaUrl + '/api/tags', { signal: AbortSignal.timeout(3000) });
      if (r.ok) {
        modelDot.classList.remove('offline');
        return true;
      }
    } catch {}
    modelDot.classList.add('offline');
    return false;
  }

  // ── Message rendering ─────────────────────────────────────────────────
  function hideWelcome() {
    if (welcome) { welcome.style.display = 'none'; }
  }

  function appendMessage(role, content, streaming) {
    const row = document.createElement('div');
    row.className = 'ai-msg ' + role;

    if (role === 'assistant') {
      const av = document.createElement('div');
      av.className = 'ai-avatar';
      av.textContent = '✨';
      row.appendChild(av);
    }

    const bubble = document.createElement('div');
    bubble.className = 'ai-bubble';
    bubble.textContent = content;
    if (streaming) {
      const cursor = document.createElement('span');
      cursor.className = 'ai-cursor';
      cursor.id = 'streamCursor';
      bubble.appendChild(cursor);
    }
    row.appendChild(bubble);
    msgContainer.appendChild(row);
    msgContainer.scrollTop = msgContainer.scrollHeight;
    return bubble;
  }

  function appendError(text) {
    const div = document.createElement('div');
    div.className = 'ai-error';
    div.innerHTML = '<span class="ai-error-icon">⚠️</span><span>' + escHtml(text) + '</span>';
    msgContainer.appendChild(div);
    msgContainer.scrollTop = msgContainer.scrollHeight;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Streaming fetch ───────────────────────────────────────────────────
  async function streamChat(msgs, bubble) {
    const resp = await fetch(ollamaUrl + '/api/chat', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ model, messages: msgs, stream: true }),
    });

    if (!resp.ok) throw new Error('Ollama returned ' + resp.status);

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let text = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const data = JSON.parse(line);
          if (data.message && data.message.content) {
            text += data.message.content;
            // Remove cursor, update text, re-add cursor
            const cursor = document.getElementById('streamCursor');
            bubble.textContent = text;
            if (!data.done) {
              const c = document.createElement('span');
              c.className = 'ai-cursor'; c.id = 'streamCursor';
              bubble.appendChild(c);
            }
            msgContainer.scrollTop = msgContainer.scrollHeight;
          }
          if (data.done) return text;
        } catch {}
      }
    }
    return text;
  }

  // ── Main send handler ─────────────────────────────────────────────────
  async function send() {
    const text = inputEl.value.trim();
    if (!text || streaming) return;

    // First message: prepend system context
    if (messages.length === 0) {
      messages.push({ role: 'system', content: buildContext() });
    }

    hideWelcome();
    streaming = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    messages.push({ role: 'user', content: text });
    appendMessage('user', text);

    const isReachable = await checkOllama();
    if (!isReachable) {
      appendError(
        'Could not connect to Ollama at ' + ollamaUrl + '. ' +
        'Make sure Ollama is running (`ollama serve`) and that you\'re opening this page ' +
        'from http:// (local), not https:// — browsers block localhost requests from HTTPS pages.'
      );
      messages.pop();
      streaming = false;
      sendBtn.disabled = false;
      return;
    }

    const bubble = appendMessage('assistant', '', true);

    try {
      const reply = await streamChat(messages, bubble);
      messages.push({ role: 'assistant', content: reply });
    } catch (err) {
      bubble.textContent = '';
      appendError('Ollama error: ' + err.message);
      messages.pop();
    }

    streaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  // ── Boot ──────────────────────────────────────────────────────────────
  checkOllama();
})();
</script>
</body>
</html>
